name: Real Chromium and Firefox Worker E2E
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  real-browsers:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify Node unit and isolated-worker regressions
        run: npm test
      - name: Install pinned Playwright harness
        run: npm install --no-save --package-lock=false playwright@1.56.1
      - name: Install real Chromium and Firefox with OS dependencies
        run: npx playwright install --with-deps chromium firefox
      - name: Run real browser module Worker integration
        run: npm run test:browser
