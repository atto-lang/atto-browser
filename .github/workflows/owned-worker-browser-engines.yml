name: Isolated actor Worker Chromium and Firefox execution
on:
  push:
    paths:
      - 'src/owned-actor-*'
      - 'src/owned-message/**'
      - 'tests/browser-engines.e2e.mjs'
      - 'tests/owned-actor-worker.test.mjs'
      - 'tests/fixtures/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/owned-worker-browser-engines.yml'
  pull_request:
    paths:
      - 'src/owned-actor-*'
      - 'src/owned-message/**'
      - 'tests/browser-engines.e2e.mjs'
      - 'tests/owned-actor-worker.test.mjs'
      - 'tests/fixtures/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/owned-worker-browser-engines.yml'
permissions:
  contents: read
jobs:
  real-browser-worker:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.1'
      - name: Install pinned browser runner
        run: |
          npm install --no-save --no-package-lock playwright@1.55.1
          npx playwright install --with-deps chromium firefox
      - name: Run source Worker and owned-message unit regressions
        run: npm test
      - name: Run real typed Worker browser-engine suite (host watchdog)
        run: node --test tests/browser-engines.e2e.mjs
