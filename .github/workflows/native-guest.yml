name: Native Oreslang guest acceptance (manual, fail closed)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-guest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Exact SHA native guest acceptance
        env:
          ORESLANG_BIN: ${{ vars.ORESLANG_BIN }}
          ORESLANG_COMPILER_SHA256: ${{ vars.ORESLANG_COMPILER_SHA256 }}
          EXPECTED_SOURCE_SHA: ${{ github.sha }}
        run: sh ci/verify-native.sh
