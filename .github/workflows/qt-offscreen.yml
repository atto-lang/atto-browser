name: Qt 6 desktop event-loop fail-closed (no guest backend)
on:
  pull_request:
    paths:
      - 'desktop/qt/**'
      - 'include/**'
      - 'tests/abi/**'
      - 'ci/check-qt-ffi.sh'
      - '.github/workflows/qt-offscreen.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qt-offscreen:
    # Do not checkout private source across organizations or run fork code in
    # a privileged native desktop process.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact PR head and tree
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_HEAD" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse --verify HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain --untracked-files=all)"
          tree="$(git rev-parse --verify 'HEAD^{tree}')"
          [[ "$tree" =~ ^[0-9a-f]{40}$ ]]
          printf 'QT_SOURCE_IDENTITY head=%s tree=%s\n' "$EXPECTED_HEAD" "$tree"
          echo "Qt host-only checkout: sha=$EXPECTED_HEAD tree=$tree" >> "$GITHUB_STEP_SUMMARY"
      - name: Install Qt6 6.5+ native build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build g++ pkg-config \
            qt6-base-dev qt6-declarative-dev qt6-declarative-dev-tools \
            libgl1-mesa-dev
      - name: Build actual Qt desktop shell and offline test
        shell: bash
        run: |
          set -euo pipefail
          cmake -S desktop/qt -B "$RUNNER_TEMP/ores-browser-qt" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
          cmake --build "$RUNNER_TEMP/ores-browser-qt" --parallel 2
      - name: Execute Qt event-loop fail-closed CTest
        shell: bash
        run: |
          set -euo pipefail
          QT_QPA_PLATFORM=offscreen ctest \
            --test-dir "$RUNNER_TEMP/ores-browser-qt" --output-on-failure
          echo 'QT_EVENT_LOOP_OFFLINE_EXECUTED (not Oreslang guest, not renderer sandbox)'
